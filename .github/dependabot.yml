version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Major upgrades (new framework, JDK or Node majors) are planned work, not weekly bumps.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      spring:
        patterns: ["org.springframework*", "io.micrometer*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Major upgrades (new framework, JDK or Node majors) are planned work, not weekly bumps.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Major upgrades (new framework, JDK or Node majors) are planned work, not weekly bumps.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directories: ["/docker", "/frontend"]
    schedule:
      interval: monthly
    ignore:
      # Major upgrades (new framework, JDK or Node majors) are planned work, not weekly bumps.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
