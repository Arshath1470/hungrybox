# Serves the React build and acts as a tiny API gateway: each /api prefix is
# routed to the service that owns it (same routing as the Kubernetes Ingress).
upstream user_service       { server user-service:8081; }
upstream restaurant_service { server restaurant-service:8082; }
upstream order_service      { server order-service:8083; }
upstream billing_service    { server billing-service:8084; }

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;

    location /api/users       { proxy_pass http://user_service; }
    location /api/restaurants { proxy_pass http://restaurant_service; }
    location /api/orders      { proxy_pass http://order_service; }
    location /api/billing     { proxy_pass http://billing_service; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/orders/12, /restaurants/3) all load index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
