name: hungrybox

x-service-env: &service-env
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-before-deploying-0123456789abcdef}
  DB_USERNAME: hungrybox
  DB_PASSWORD: ${MYSQL_PASSWORD:-hungrybox}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092

x-healthcheck: &actuator-health
  interval: 10s
  timeout: 3s
  retries: 12
  start_period: 30s

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-change-me}
      MYSQL_USER: hungrybox
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hungrybox}
      MYSQL_DATABASE: hb_users
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.9.0
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  user-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: user-service
    image: ghcr.io/arshath1470/hungrybox-user-service:local
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/hb_users?allowPublicKeyRetrieval=true&useSSL=false
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@hungrybox.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health/readiness | grep -q UP"]
      <<: *actuator-health

  restaurant-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: restaurant-service
    image: ghcr.io/arshath1470/hungrybox-restaurant-service:local
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/hb_restaurants?allowPublicKeyRetrieval=true&useSSL=false
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health/readiness | grep -q UP"]
      <<: *actuator-health

  order-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: order-service
    image: ghcr.io/arshath1470/hungrybox-order-service:local
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/hb_orders?allowPublicKeyRetrieval=true&useSSL=false
      RESTAURANT_SERVICE_URL: http://restaurant-service:8082
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      restaurant-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/actuator/health/readiness | grep -q UP"]
      <<: *actuator-health

  billing-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: billing-service
    image: ghcr.io/arshath1470/hungrybox-billing-service:local
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/hb_billing?allowPublicKeyRetrieval=true&useSSL=false
      MAX_TRANSACTION_AMOUNT: ${MAX_TRANSACTION_AMOUNT:-5000}
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8084/actuator/health/readiness | grep -q UP"]
      <<: *actuator-health

  frontend:
    build: ./frontend
    image: ghcr.io/arshath1470/hungrybox-frontend:local
    ports:
      - "8080:8080"
    depends_on:
      user-service: { condition: service_healthy }
      restaurant-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
      billing-service: { condition: service_healthy }

volumes:
  mysql-data:
