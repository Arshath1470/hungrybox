server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: restaurant-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hb_restaurants?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:hungrybox}
    password: ${DB_PASSWORD:hungrybox}

hungrybox:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-before-deploying-0123456789abcdef}
    public-paths:
      - "GET /api/restaurants"
      - "GET /api/restaurants/**"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
