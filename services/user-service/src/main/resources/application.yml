server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hb_users?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:hungrybox}
    password: ${DB_PASSWORD:hungrybox}

hungrybox:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-before-deploying-0123456789abcdef}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:120}
    public-paths:
      - "POST /api/users/register"
      - "POST /api/users/login"
  admin:
    email: ${ADMIN_EMAIL:admin@hungrybox.dev}
    password: ${ADMIN_PASSWORD:Admin@12345}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
