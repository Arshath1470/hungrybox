server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hb_orders?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:hungrybox}
    password: ${DB_PASSWORD:hungrybox}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      auto-offset-reset: earliest
    producer:
      acks: all

hungrybox:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-before-deploying-0123456789abcdef}
  restaurant-service:
    url: ${RESTAURANT_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
